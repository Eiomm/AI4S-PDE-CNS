strategies:
  - name: agent_main
    description: 使用新的 agent loop，由 planner 在可用 action 和 memory context 中选择下一步。
    technique: inference
    runner: agent
    rounds: 4
    per_round: 10
    top_k: 10
    mode: proxy
    docking_limit: 0
    llm_enabled: true
    env:
      CHEM_EVOLVE_LLM_TEMPERATURE: "0.25"
      CHEM_EVOLVE_LLM_MAX_TOKENS: "700"
