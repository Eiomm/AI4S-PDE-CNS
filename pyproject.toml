[project]
name = "chem-evolve-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2",
  "pandas>=2",
  "pyyaml>=6",
  "litellm>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
